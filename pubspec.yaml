name: tabby
description: "Keep tabs. Settle up. Filipino peer-to-peer financial relationship tracker."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter

  # Backend BaaS & Realtime
  supabase_flutter: ^2.8.0

  # Google Sign-In (native iOS & Android OAuth)
  google_sign_in: ^6.2.1

  # State Management & Dependency Injection
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Local-First Offline Persistence
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0

  # Navigation & Deep Links
  go_router: ^14.3.0

  # Mascot Animations & UI Polish
  rive: ^0.13.4
  lottie: ^3.1.2

  # Proof of Payment (Receipts) & Media
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0

  # Connectivity & Hardware Security
  connectivity_plus: ^6.0.5
  flutter_secure_storage: ^9.2.2

  # Utility & Localization
  intl: ^0.19.0
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.12
  drift_dev: ^2.20.0
  riverpod_generator: ^2.6.1
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/branding/tabby-icon.jpg"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/branding/tabby-icon.jpg"
    background_color: "#1F1F1F"
    theme_color: "#1F1F1F"

flutter:
  uses-material-design: true
  assets:
    - assets/branding/


