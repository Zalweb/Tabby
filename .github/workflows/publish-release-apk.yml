name: Recover Paired Mobile Release
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Successful same-repository main mobile build run containing both verified candidates'
        required: true
      candidate_commit:
        description: 'Exact 40-character source commit with reviewed release evidence'
        required: true
permissions:
  actions: read
  contents: write
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/publish-latest-build.yml
    with:
      run_id: ${{ inputs.run_id }}
      candidate_commit: ${{ inputs.candidate_commit }}
    secrets: inherit
