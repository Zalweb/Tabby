name: Build iOS IPA

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios:
    name: Build IPA (No-Codesign)
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: 'stable'
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Create iOS platform
        run: flutter create --platforms=ios .

      - name: Get Flutter packages
        run: flutter pub get

      - name: Generate iOS launcher icons
        run: dart run flutter_launcher_icons

      - name: Run build_runner
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Create .env from secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GOOGLE_IOS_CLIENT_ID: ${{ secrets.GOOGLE_IOS_CLIENT_ID }}
          GOOGLE_ANDROID_CLIENT_ID: ${{ secrets.GOOGLE_ANDROID_CLIENT_ID }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
        run: |
          echo "SUPABASE_URL=$SUPABASE_URL" > .env
          echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY" >> .env
          echo "GOOGLE_IOS_CLIENT_ID=$GOOGLE_IOS_CLIENT_ID" >> .env
          echo "GOOGLE_ANDROID_CLIENT_ID=$GOOGLE_ANDROID_CLIENT_ID" >> .env
          echo "GOOGLE_WEB_CLIENT_ID=$GOOGLE_WEB_CLIENT_ID" >> .env

      # ── CRITICAL: Inject Google Sign-In reversed URL scheme into Info.plist ──
      # google_sign_in on iOS requires the reversed client ID as a URL scheme
      # so that Google can redirect back to the app after authentication.
      - name: Patch Info.plist with Google URL scheme
        env:
          GOOGLE_IOS_CLIENT_ID: ${{ secrets.GOOGLE_IOS_CLIENT_ID }}
        run: |
          # Derive the reversed client ID from the full client ID
          # e.g. "12345-abc.apps.googleusercontent.com" -> "com.googleusercontent.apps.12345-abc"
          REVERSED_CLIENT_ID=$(echo "$GOOGLE_IOS_CLIENT_ID" | awk -F'.' '{
            for(i=NF;i>0;i--) printf "%s%s", $i, (i>1 ? "." : "")
          }')

          echo "Reversed Client ID: $REVERSED_CLIENT_ID"

          INFO_PLIST="ios/Runner/Info.plist"

          # Insert CFBundleURLTypes with Google reversed client ID before </dict> at end
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes array" "$INFO_PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0 dict" "$INFO_PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleTypeRole string Editor" "$INFO_PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLName string google" "$INFO_PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" "$INFO_PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string $REVERSED_CLIENT_ID" "$INFO_PLIST"

          # Ensure camera, photo library, and Face ID descriptions exist
          /usr/libexec/PlistBuddy -c "Add :NSFaceIDUsageDescription string 'Tabby uses Face ID to securely authenticate and protect your financial tabs.'" "$INFO_PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'Tabby uses the camera to scan and upload QR codes, payment receipts, and profile photos.'" "$INFO_PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string 'Tabby accesses your photo library to let you upload QR codes, payment receipts, and profile photos.'" "$INFO_PLIST" 2>/dev/null || true

          echo "Info.plist patched successfully."
          /usr/libexec/PlistBuddy -c "Print :CFBundleURLTypes" "$INFO_PLIST"

      - name: Pod install
        run: |
          cd ios
          pod install --repo-update
          cd ..

      - name: Build IPA
        env:
          GOOGLE_IOS_CLIENT_ID: ${{ secrets.GOOGLE_IOS_CLIENT_ID }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          flutter build ipa --no-codesign --release \
            --dart-define=GOOGLE_IOS_CLIENT_ID=$GOOGLE_IOS_CLIENT_ID \
            --dart-define=GOOGLE_WEB_CLIENT_ID=$GOOGLE_WEB_CLIENT_ID \
            --dart-define=SUPABASE_URL=$SUPABASE_URL \
            --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY

      - name: Package IPA from xcarchive
        run: |
          echo "=== Searching for IPA/xcarchive ==="
          find build/ios -maxdepth 4 \( -name "*.ipa" -o -name "*.xcarchive" \) 2>/dev/null | sort

          IPA=$(find build/ios -name "*.ipa" | head -1)

          if [ -n "$IPA" ]; then
            echo "Found IPA: $IPA"
            mkdir -p output
            cp "$IPA" output/Tabby.ipa
          else
            echo "Packaging from xcarchive..."
            ARCHIVE=$(find build/ios/archive -name "*.xcarchive" | head -1)
            echo "Archive: $ARCHIVE"
            mkdir -p /tmp/Payload
            cp -R "$ARCHIVE/Products/Applications/Runner.app" /tmp/Payload/
            cd /tmp && zip -r Tabby.ipa Payload/
            cd -
            mkdir -p output
            cp /tmp/Tabby.ipa output/Tabby.ipa
          fi

          echo "Final output:"
          ls -lh output/

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tabby-${{ github.ref_name }}-ipa
          path: output/Tabby.ipa
          retention-days: 30

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: output/Tabby.ipa
          name: Tabby ${{ github.ref_name }}
          body: |
            ## Tabby ${{ github.ref_name }}

            ### Install via Sideloadly
            1. Download Tabby.ipa below.
            2. Open Sideloadly on your PC.
            3. Connect your iPhone via USB.
            4. Drag the .ipa into Sideloadly and click Start.
            5. Trust the certificate: Settings > General > VPN and Device Management.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
