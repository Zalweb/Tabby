name: Build iOS IPA

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios:
    name: Build IPA (No-Codesign)
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: 'stable'
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Create iOS platform
        run: flutter create --platforms=ios .

      - name: Get Flutter packages
        run: flutter pub get

      - name: Generate iOS launcher icons
        run: dart run flutter_launcher_icons


      - name: Create .env from secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GOOGLE_IOS_CLIENT_ID: ${{ secrets.GOOGLE_IOS_CLIENT_ID }}
          GOOGLE_ANDROID_CLIENT_ID: ${{ secrets.GOOGLE_ANDROID_CLIENT_ID }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
        run: |
          echo "SUPABASE_URL=$SUPABASE_URL" > .env
          echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY" >> .env
          echo "GOOGLE_IOS_CLIENT_ID=$GOOGLE_IOS_CLIENT_ID" >> .env
          echo "GOOGLE_ANDROID_CLIENT_ID=$GOOGLE_ANDROID_CLIENT_ID" >> .env
          echo "GOOGLE_WEB_CLIENT_ID=$GOOGLE_WEB_CLIENT_ID" >> .env

      # ── CRITICAL: Keep native OAuth and media permissions in Info.plist ──
      # google_sign_in on iOS requires the reversed client ID as a URL scheme
      # so that Google can redirect back to the app after authentication.
      - name: Patch Info.plist with Google URL scheme
        env:
          GOOGLE_IOS_CLIENT_ID: ${{ secrets.GOOGLE_IOS_CLIENT_ID }}
        run: |
          python3 <<'PY'
          import os
          import plistlib

          info_plist = "ios/Runner/Info.plist"
          client_id = os.environ["GOOGLE_IOS_CLIENT_ID"].strip()
          if not client_id:
              raise SystemExit("GOOGLE_IOS_CLIENT_ID is required for iOS OAuth")

          reversed_client_id = ".".join(reversed(client_id.split(".")))
          with open(info_plist, "rb") as handle:
              plist = plistlib.load(handle)

          url_types = plist.setdefault("CFBundleURLTypes", [])
          google_entry = next(
              (entry for entry in url_types if entry.get("CFBundleURLName") == "google"),
              None,
          )
          if google_entry is None:
              google_entry = {
                  "CFBundleTypeRole": "Editor",
                  "CFBundleURLName": "google",
                  "CFBundleURLSchemes": [],
              }
              url_types.insert(0, google_entry)
          google_entry["CFBundleTypeRole"] = "Editor"
          google_entry["CFBundleURLSchemes"] = [reversed_client_id]

          supabase_entry = next(
              (entry for entry in url_types if entry.get("CFBundleURLName") == "supabase"),
              None,
          )
          if supabase_entry is None:
              url_types.append({
                  "CFBundleTypeRole": "Editor",
                  "CFBundleURLName": "supabase",
                  "CFBundleURLSchemes": ["io.supabase.tabby"],
              })
          elif "io.supabase.tabby" not in supabase_entry.get("CFBundleURLSchemes", []):
              supabase_entry.setdefault("CFBundleURLSchemes", []).append("io.supabase.tabby")

          plist.update({
              "NSFaceIDUsageDescription": "Tabby uses Face ID to securely authenticate and protect your financial tabs.",
              "NSCameraUsageDescription": "Tabby uses the camera to scan and upload QR codes, payment receipts, and profile photos.",
              "NSPhotoLibraryUsageDescription": "Tabby accesses your photo library to let you upload QR codes, payment receipts, and profile photos.",
          })

          with open(info_plist, "wb") as handle:
              plistlib.dump(plist, handle, sort_keys=False)
          print("Info.plist patched successfully with native OAuth and media permissions.")
          PY

      - name: Pod install
        run: |
          cd ios
          pod install --repo-update
          cd ..

      - name: Build IPA
        env:
          GOOGLE_IOS_CLIENT_ID: ${{ secrets.GOOGLE_IOS_CLIENT_ID }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          flutter build ipa --no-codesign --release \
            --dart-define=GOOGLE_IOS_CLIENT_ID=$GOOGLE_IOS_CLIENT_ID \
            --dart-define=GOOGLE_WEB_CLIENT_ID=$GOOGLE_WEB_CLIENT_ID \
            --dart-define=SUPABASE_URL=$SUPABASE_URL \
            --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY

      - name: Package IPA from xcarchive
        run: |
          echo "=== Searching for IPA/xcarchive ==="
          find build/ios -maxdepth 4 \( -name "*.ipa" -o -name "*.xcarchive" \) 2>/dev/null | sort

          IPA=$(find build/ios -name "*.ipa" | head -1)

          if [ -n "$IPA" ]; then
            echo "Found IPA: $IPA"
            mkdir -p output
            cp "$IPA" output/Tabby.ipa
          else
            echo "Packaging from xcarchive..."
            ARCHIVE=$(find build/ios/archive -name "*.xcarchive" | head -1)
            echo "Archive: $ARCHIVE"
            mkdir -p /tmp/Payload
            cp -R "$ARCHIVE/Products/Applications/Runner.app" /tmp/Payload/
            cd /tmp && zip -r Tabby.ipa Payload/
            cd -
            mkdir -p output
            cp /tmp/Tabby.ipa output/Tabby.ipa
          fi

          echo "Final output:"
          ls -lh output/

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tabby-${{ github.ref_name }}-ipa
          path: output/Tabby.ipa
          retention-days: 30

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: output/Tabby.ipa
          name: Tabby ${{ github.ref_name }}
          body: |
            ## Tabby ${{ github.ref_name }}

            ### Install via Sideloadly
            1. Download Tabby.ipa below.
            2. Open Sideloadly on your PC.
            3. Connect your iPhone via USB.
            4. Drag the .ipa into Sideloadly and click Start.
            5. Trust the certificate: Settings > General > VPN and Device Management.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
