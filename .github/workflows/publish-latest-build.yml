name: Verify and publish Android candidate

on:
  workflow_call:
    inputs:
      run_id:
        type: string
        required: true
      candidate_commit:
        type: string
        required: true

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-android-candidate
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: android-release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate candidate build provenance
        uses: actions/github-script@v7
        env:
          BUILD_RUN_ID: ${{ inputs.run_id }}
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
        with:
          script: |
            const runId = process.env.BUILD_RUN_ID;
            const commit = process.env.CANDIDATE_COMMIT;
            if (!/^[1-9][0-9]*$/.test(runId) || !/^[a-f0-9]{40}$/.test(commit)) throw new Error('Invalid build run/commit');
            const {data: run} = await github.rest.actions.getWorkflowRun({...context.repo, run_id: runId});
            if (run.conclusion !== 'success' || run.head_sha !== commit ||
                run.path !== '.github/workflows/build-mobile.yml' ||
                run.head_repository?.full_name !== `${context.repo.owner}/${context.repo.repo}` ||
                !['push', 'workflow_dispatch'].includes(run.event)) throw new Error('Build provenance mismatch');
      - uses: actions/download-artifact@v4
        with:
          name: Tabby-android-candidate
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: candidate
      - name: Install pinned APK verification tools
        shell: bash
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;36.0.0"'
      - name: Verify exact APK and candidate evidence
        id: verified
        env:
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          ANDROID_RELEASE_CERT_SHA256: ${{ vars.ANDROID_RELEASE_CERT_SHA256 }}
        shell: bash
        run: |
          set -euo pipefail
          node --test scripts/android-release.test.cjs
          node scripts/check-project-memory.cjs
          node scripts/verify-android-artifact.cjs --apk candidate/Tabby.apk --commit "$CANDIDATE_COMMIT" --output candidate/rechecked.json
          cmp candidate/candidate-manifest.json candidate/rechecked.json
          node scripts/check-release-gate.cjs --manifest candidate/rechecked.json
          node -p '"tag=v"+require("./candidate/rechecked.json").version_name+"+"+require("./candidate/rechecked.json").version_code' >> "$GITHUB_OUTPUT"
      - name: Publish verified Android candidate
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.verified.outputs.tag }}
          target_commitish: ${{ inputs.candidate_commit }}
          name: Tabby ${{ steps.verified.outputs.tag }}
          files: |
            candidate/Tabby.apk
            candidate/rechecked.json
          overwrite_files: false
          make_latest: true
          body: 'Verified Android candidate; exact artifact evidence is recorded in docs/releases. No iOS artifact is published by this workflow.'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
