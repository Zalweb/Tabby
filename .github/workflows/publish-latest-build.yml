name: Publish Latest Build

on:
  workflow_run:
    workflows:
      - Build Android APK
      - Build iOS IPA
    types:
      - completed

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-latest-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest

    steps:
      - name: Resolve matching successful platform builds
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          find_run() {
            local workflow_file="$1"
            gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_file}/runs?head_sha=${COMMIT_SHA}&per_page=100" \
              --jq '.workflow_runs[] | select(.conclusion == "success" and .head_branch == "main") | .id' \
              | head -n 1
          }

          for attempt in $(seq 1 12); do
            ANDROID_RUN_ID="$(find_run build-android.yml || true)"
            IOS_RUN_ID="$(find_run build-ios.yml || true)"

            if [[ -n "$ANDROID_RUN_ID" && -n "$IOS_RUN_ID" ]]; then
              echo "android_run_id=$ANDROID_RUN_ID" >> "$GITHUB_OUTPUT"
              echo "ios_run_id=$IOS_RUN_ID" >> "$GITHUB_OUTPUT"
              echo "ready=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "Attempt $attempt: waiting for both successful platform builds for $COMMIT_SHA"
            sleep 10
          done

          echo "ready=false" >> "$GITHUB_OUTPUT"
          echo "Both platform builds were not available for $COMMIT_SHA; nothing will be published."

      - name: Download Android APK artifact
        if: steps.resolve.outputs.ready == 'true'
        uses: actions/download-artifact@v4
        with:
          name: Tabby-main-apk
          run-id: ${{ steps.resolve.outputs.android_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: android-artifact

      - name: Download iOS IPA artifact
        if: steps.resolve.outputs.ready == 'true'
        uses: actions/download-artifact@v4
        with:
          name: Tabby-main-ipa
          run-id: ${{ steps.resolve.outputs.ios_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ios-artifact

      - name: Prepare stable public asset names
        if: steps.resolve.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp "$(find android-artifact -type f -name 'Tabby.apk' | head -n 1)" release-assets/Tabby.apk
          cp "$(find ios-artifact -type f -name 'Tabby.ipa' | head -n 1)" release-assets/Tabby.ipa
          ls -lh release-assets

      - name: Publish rolling latest release
        if: steps.resolve.outputs.ready == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Tabby Latest Build
          body: |
            Automatically published from the successful Android and iOS builds for commit ${{ github.event.workflow_run.head_sha }}.

            The website reads this rolling release automatically and always serves the newest successful APK.
          files: |
            release-assets/Tabby.apk
            release-assets/Tabby.ipa
          overwrite_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
