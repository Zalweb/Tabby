name: Reconcile paired mobile release

on:
  workflow_run:
    workflows:
      - Build Android APK + iOS IPA
    branches:
      - main
    types:
      - completed
  push:
    branches:
      - main
    paths:
      - docs/releases/**
      - docs/progress/tasks/**
      - docs/progress/STATUS.md
      - docs/verification/**
  schedule:
    - cron: '27 3 * * *'
  workflow_call:
    inputs:
      run_id:
        description: Successful mobile build run for guarded recovery
        type: string
        required: true
      candidate_commit:
        description: Exact commit from that same successful mobile build
        type: string
        required: true

permissions:
  actions: read
  contents: read

concurrency:
  group: paired-mobile-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      run_id: ${{ steps.select.outputs.run_id }}
      candidate_commit: ${{ steps.select.outputs.commit }}
      ios_artifact: ${{ steps.select.outputs.ios_artifact }}
      publish_action: ${{ steps.release-plan.outputs.action }}
      release_tag: ${{ steps.release-plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Fetch all trusted origin tags for exact tag-target checks
        run: git fetch --force origin '+refs/tags/*:refs/tags/*'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Select the newest eligible main build with reviewed release evidence
        id: select
        uses: actions/github-script@v7
        env:
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
          MANUAL_RUN_ID: ${{ inputs.run_id }}
          MANUAL_CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
        with:
          script: |
            const selected = await require('./scripts/mobile-release.cjs').selectBuildRun({github, context, env: process.env});
            if (!selected) {
              core.setOutput('ready', 'false');
              core.info('No successful main build has matching reviewed release evidence; skipping publication.');
              return;
            }
            core.setOutput('ready', 'true');
            core.setOutput('run_id', selected.run_id);
            core.setOutput('run_number', String(selected.run_number));
            core.setOutput('commit', selected.commit);
            core.setOutput('ios_artifact', selected.ios_artifact);
      - name: Download the exact private Android candidate
        if: steps.select.outputs.ready == 'true'
        uses: actions/download-artifact@v4
        with:
          name: Tabby-android-candidate
          run-id: ${{ steps.select.outputs.run_id }}
          github-token: ${{ github.token }}
          path: candidate
      - name: Download the paired unsigned iOS candidate
        if: steps.select.outputs.ready == 'true'
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.select.outputs.ios_artifact }}
          run-id: ${{ steps.select.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ios-candidate
      - name: Install pinned APK verification tools
        if: steps.select.outputs.ready == 'true'
        shell: bash
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;36.0.0"'
      - name: Recheck Android signature, digest, version and exact release gate
        if: steps.select.outputs.ready == 'true'
        env:
          CANDIDATE_COMMIT: ${{ steps.select.outputs.commit }}
          ANDROID_RELEASE_CERT_SHA256: ${{ vars.ANDROID_RELEASE_CERT_SHA256 }}
        shell: bash
        run: |
          set -euo pipefail
          node --test scripts/android-release.test.cjs
          node scripts/check-project-memory.cjs
          node scripts/verify-android-artifact.cjs \
            --apk candidate/Tabby.apk \
            --commit "$CANDIDATE_COMMIT" \
            --output candidate/rechecked.json
          cmp candidate/candidate-manifest.json candidate/rechecked.json
          node scripts/check-release-gate.cjs --manifest candidate/rechecked.json
      - name: Recheck the iOS package, source, shared version and unsigned arm64 report
        if: steps.select.outputs.ready == 'true'
        env:
          CANDIDATE_COMMIT: ${{ steps.select.outputs.commit }}
        run: |
          python3 scripts/verify-ios-artifact.py \
            --ipa ios-candidate/Tabby.ipa \
            --report ios-candidate/Tabby.ipa.json \
            --source-manifest ios-candidate/ios-build-source-manifest.json \
            --android-manifest candidate/rechecked.json \
            --commit "$CANDIDATE_COMMIT"
      - name: Decide whether this exact paired release can become latest
        if: steps.select.outputs.ready == 'true'
        id: release-plan
        uses: actions/github-script@v7
        env:
          CANDIDATE_COMMIT: ${{ steps.select.outputs.commit }}
        with:
          script: |
            const fs = require('node:fs');
            const release = require('./scripts/mobile-release.cjs');
            const android = JSON.parse(fs.readFileSync('candidate/rechecked.json', 'utf8'));
            const ios = JSON.parse(fs.readFileSync('ios-candidate/Tabby.ipa.json', 'utf8'));
            const candidate = release.validatePairedCandidates(android, ios);
            if (candidate.commit !== process.env.CANDIDATE_COMMIT) throw new Error('Paired artifacts do not match the selected source commit');
            const tagTarget = release.verifyTagTarget(process.cwd(), candidate.tag, candidate.commit);
            const releases = await github.paginate(github.rest.repos.listReleases, {...context.repo, per_page: 100});
            let latest = null;
            try { latest = (await github.rest.repos.getLatestRelease(context.repo)).data; }
            catch (error) { if (error.status !== 404) throw error; }
            const decision = release.planRelease(candidate, releases, latest, tagTarget);
            core.setOutput('action', decision.action);
            core.setOutput('tag', decision.tag);
            core.info(`Paired release decision: ${decision.action} (${decision.tag})`);

  publish:
    needs: prepare
    if: >-
      needs.prepare.outputs.publish_action == 'create' ||
      needs.prepare.outputs.publish_action == 'resume-draft' ||
      needs.prepare.outputs.publish_action == 'promote-existing'
    runs-on: ubuntu-latest
    environment: android-release
    permissions:
      actions: read
      contents: write
    env:
      CANDIDATE_COMMIT: ${{ needs.prepare.outputs.candidate_commit }}
      EXPECTED_RUN_ID: ${{ needs.prepare.outputs.run_id }}
      EXPECTED_CANDIDATE_COMMIT: ${{ needs.prepare.outputs.candidate_commit }}
      RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Fetch all trusted origin tags for exact tag-target checks
        run: git fetch --force origin '+refs/tags/*:refs/tags/*'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Reconfirm the latest eligible main build after release approval
        id: select
        uses: actions/github-script@v7
        env:
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
          MANUAL_RUN_ID: ${{ inputs.run_id }}
          MANUAL_CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          EXPECTED_RUN_ID: ${{ needs.prepare.outputs.run_id }}
          EXPECTED_CANDIDATE_COMMIT: ${{ needs.prepare.outputs.candidate_commit }}
        with:
          script: |
            const selected = await require('./scripts/mobile-release.cjs').selectBuildRun({github, context, env: process.env});
            if (!selected) {
              core.setOutput('ready', 'false');
              core.info('The reviewed release evidence is no longer present on trusted main; skipping publication.');
              return;
            }
            core.setOutput('ready', 'true');
            core.setOutput('run_id', selected.run_id);
            core.setOutput('ios_artifact', selected.ios_artifact);
      - name: Download the exact private Android candidate again
        if: steps.select.outputs.ready == 'true'
        uses: actions/download-artifact@v4
        with:
          name: Tabby-android-candidate
          run-id: ${{ steps.select.outputs.run_id }}
          github-token: ${{ github.token }}
          path: candidate
      - name: Download the paired unsigned iOS candidate again
        if: steps.select.outputs.ready == 'true'
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.select.outputs.ios_artifact }}
          run-id: ${{ steps.select.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ios-candidate
      - name: Install pinned APK verification tools
        if: steps.select.outputs.ready == 'true'
        shell: bash
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;36.0.0"'
      - name: Repeat all platform and production evidence checks
        if: steps.select.outputs.ready == 'true'
        env:
          ANDROID_RELEASE_CERT_SHA256: ${{ vars.ANDROID_RELEASE_CERT_SHA256 }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-android-artifact.cjs \
            --apk candidate/Tabby.apk \
            --commit "$CANDIDATE_COMMIT" \
            --output candidate/rechecked.json
          cmp candidate/candidate-manifest.json candidate/rechecked.json
          node scripts/check-release-gate.cjs --manifest candidate/rechecked.json
          python3 scripts/verify-ios-artifact.py \
            --ipa ios-candidate/Tabby.ipa \
            --report ios-candidate/Tabby.ipa.json \
            --source-manifest ios-candidate/ios-build-source-manifest.json \
            --android-manifest candidate/rechecked.json \
            --commit "$CANDIDATE_COMMIT"
      - name: Recheck tag and latest-release state before changing a draft
        if: steps.select.outputs.ready == 'true'
        id: release-plan
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const release = require('./scripts/mobile-release.cjs');
            const android = JSON.parse(fs.readFileSync('candidate/rechecked.json', 'utf8'));
            const ios = JSON.parse(fs.readFileSync('ios-candidate/Tabby.ipa.json', 'utf8'));
            const candidate = release.validatePairedCandidates(android, ios);
            if (candidate.commit !== process.env.CANDIDATE_COMMIT || candidate.tag !== process.env.RELEASE_TAG) throw new Error('Candidate release identity changed');
            const tagTarget = release.verifyTagTarget(process.cwd(), candidate.tag, candidate.commit);
            const releases = await github.paginate(github.rest.repos.listReleases, {...context.repo, per_page: 100});
            let latest = null;
            try { latest = (await github.rest.repos.getLatestRelease(context.repo)).data; }
            catch (error) { if (error.status !== 404) throw error; }
            const decision = release.planRelease(candidate, releases, latest, tagTarget);
            core.setOutput('action', decision.action);
            core.setOutput('tag', decision.tag);
            core.info(`Post-approval release decision: ${decision.action} (${decision.tag})`);
      - name: Clear only prior assets from the matching unpublished draft
        if: steps.select.outputs.ready == 'true' && steps.release-plan.outputs.action == 'resume-draft'
        uses: actions/github-script@v7
        env:
          CANDIDATE_COMMIT: ${{ env.CANDIDATE_COMMIT }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        with:
          script: |
            const tagTarget = require('./scripts/mobile-release.cjs').verifyTagTarget(process.cwd(), process.env.RELEASE_TAG, process.env.CANDIDATE_COMMIT);
            const releases = await github.paginate(github.rest.repos.listReleases, {...context.repo, per_page: 100});
            const draft = releases.find((item) => item.tag_name === process.env.RELEASE_TAG);
            if (!draft || !draft.draft ||
                (!tagTarget && draft.target_commitish?.toLowerCase() !== process.env.CANDIDATE_COMMIT)) {
              throw new Error('Existing release is not the matching unpublished candidate draft');
            }
            const unexpected = draft.assets.filter((asset) => !['Tabby.apk', 'Tabby.ipa'].includes(asset.name));
            if (unexpected.length) throw new Error('Candidate draft contains unexpected public assets');
            for (const asset of draft.assets) {
              await github.rest.repos.deleteReleaseAsset({...context.repo, asset_id: asset.id});
            }
      - name: Upload Android and iOS assets to an unpublished draft
        if: steps.select.outputs.ready == 'true' && (steps.release-plan.outputs.action == 'create' || steps.release-plan.outputs.action == 'resume-draft')
        uses: actions/github-script@v7
        env:
          CANDIDATE_COMMIT: ${{ env.CANDIDATE_COMMIT }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        with:
          script: |
            require('./scripts/mobile-release.cjs').verifyTagTarget(process.cwd(), process.env.RELEASE_TAG, process.env.CANDIDATE_COMMIT);
      - name: Create or refresh the unpublished paired release draft
        if: steps.select.outputs.ready == 'true' && (steps.release-plan.outputs.action == 'create' || steps.release-plan.outputs.action == 'resume-draft')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ env.CANDIDATE_COMMIT }}
          name: Tabby downloads
          body: >-
            iOS requires your Apple ID and Sideloadly. Tabby does not hold or move money.
          draft: true
          prerelease: false
          make_latest: false
          overwrite_files: false
          fail_on_unmatched_files: true
          files: |
            candidate/Tabby.apk
            ios-candidate/Tabby.ipa
      - name: Verify both uploaded asset digests before publishing
        if: steps.select.outputs.ready == 'true' && (steps.release-plan.outputs.action == 'create' || steps.release-plan.outputs.action == 'resume-draft')
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
          CANDIDATE_COMMIT: ${{ env.CANDIDATE_COMMIT }}
        with:
          script: |
            const fs = require('node:fs');
            const crypto = require('node:crypto');
            const release = require('./scripts/mobile-release.cjs');
            release.verifyTagTarget(process.cwd(), process.env.RELEASE_TAG, process.env.CANDIDATE_COMMIT);
            const releases = await github.paginate(github.rest.repos.listReleases, {...context.repo, per_page: 100});
            const draft = releases.find((item) => item.tag_name === process.env.RELEASE_TAG);
            if (!draft || !draft.draft) throw new Error('Paired upload did not remain an unpublished draft');
            const digest = (file) => crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex');
            for (const [name, file] of [['Tabby.apk', 'candidate/Tabby.apk'], ['Tabby.ipa', 'ios-candidate/Tabby.ipa']]) {
              const asset = draft.assets.find((item) => item.name === name);
              if (!asset || asset.state !== 'uploaded' || asset.digest !== `sha256:${digest(file)}`) throw new Error(`Published draft asset failed byte verification: ${name}`);
            }
      - name: Publish the complete pair as latest
        if: steps.select.outputs.ready == 'true' && steps.release-plan.outputs.action != 'noop' && steps.release-plan.outputs.action != 'skip-stale'
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
          CANDIDATE_COMMIT: ${{ env.CANDIDATE_COMMIT }}
        with:
          script: |
            const release = require('./scripts/mobile-release.cjs');
            const fs = require('node:fs');
            const crypto = require('node:crypto');
            const releases = await github.paginate(github.rest.repos.listReleases, {...context.repo, per_page: 100});
            const latest = (await github.rest.repos.getLatestRelease(context.repo).catch((error) => {
              if (error.status === 404) return {data: null};
              throw error;
            })).data;
            const android = JSON.parse(fs.readFileSync('candidate/rechecked.json', 'utf8'));
            const ios = JSON.parse(fs.readFileSync('ios-candidate/Tabby.ipa.json', 'utf8'));
            const candidate = release.validatePairedCandidates(android, ios);
            const digest = (file) => crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex');
            if (candidate.apk_sha256 !== digest('candidate/Tabby.apk') || candidate.ipa_sha256 !== digest('ios-candidate/Tabby.ipa')) {
              throw new Error('Local release assets changed after byte verification');
            }
            const tagTarget = release.verifyTagTarget(process.cwd(), candidate.tag, candidate.commit);
            const decision = release.planRelease(candidate, releases, latest, tagTarget);
            if (decision.action === 'skip-stale' || decision.action === 'noop') {
              core.info(`No release mutation required: ${decision.action} (${decision.tag})`);
              return;
            }
            const record = releases.find((item) => item.tag_name === process.env.RELEASE_TAG);
            if (!record || (decision.action === 'resume-draft' && !record.draft) ||
                (decision.action === 'promote-existing' && record.draft)) throw new Error('Release is not in the expected verified state');
            for (const [name, expected] of [['Tabby.apk', candidate.apk_sha256], ['Tabby.ipa', candidate.ipa_sha256]]) {
              if (release.assetDigest(record, name) !== expected) throw new Error(`Release asset digest is missing or wrong: ${name}`);
            }
            const published = await github.rest.repos.updateRelease({...context.repo, release_id: record.id, draft: false, prerelease: false, make_latest: 'true'});
            if (published.data.draft) throw new Error('GitHub kept the complete pair in draft state');
            const current = (await github.rest.repos.getLatestRelease(context.repo)).data;
            if (current.id !== record.id) throw new Error('The approved paired release did not become the latest public release');
            core.info(`Published the verified Android and iOS pair: ${candidate.tag}`);
