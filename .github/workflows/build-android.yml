name: Build Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: 'stable'
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Create Android platform
        run: flutter create --platforms=android .

      - name: Get Flutter packages
        run: flutter pub get

      - name: Run build_runner
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Create .env from secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          echo "SUPABASE_URL=$SUPABASE_URL" > .env
          echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY" >> .env

      - name: Build release APK
        env:
          GOOGLE_IOS_CLIENT_ID: ${{ secrets.GOOGLE_IOS_CLIENT_ID }}
          GOOGLE_ANDROID_CLIENT_ID: ${{ secrets.GOOGLE_ANDROID_CLIENT_ID }}
        run: |
          flutter build apk --release \
            --dart-define=GOOGLE_IOS_CLIENT_ID=$GOOGLE_IOS_CLIENT_ID \
            --dart-define=GOOGLE_ANDROID_CLIENT_ID=$GOOGLE_ANDROID_CLIENT_ID

      - name: Rename APK
        run: |
          mkdir -p output
          cp build/app/outputs/flutter-apk/app-release.apk output/Tabby-${{ github.ref_name }}.apk
          echo "APK info:"
          ls -lh output/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tabby-${{ github.ref_name }}-apk
          path: output/Tabby-${{ github.ref_name }}.apk
          retention-days: 30

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: output/Tabby-${{ github.ref_name }}.apk
          name: Tabby ${{ github.ref_name }}
          body: |
            ## Tabby ${{ github.ref_name }}

            ### Android Installation
            1. Download Tabby-${{ github.ref_name }}.apk below.
            2. Transfer it to your Android phone.
            3. Open the APK on your phone.
            4. Allow "Install from unknown sources" if prompted.
            5. Install and open Tabby.

            ### iOS Installation (via Sideloadly)
            1. Download Tabby.ipa below.
            2. Open Sideloadly on your PC.
            3. Connect your iPhone via USB.
            4. Drag the .ipa into Sideloadly and click Start.
            5. Trust the certificate: Settings > General > VPN and Device Management.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}